<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>兩人家計簿</title>
<meta name="theme-color" content="#F2F3ED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #F2F3ED; }
.kb {
  --paper: #F2F3ED;
  --card: #FCFCF8;
  --ink: #2B3440;
  --soft: #66727E;
  --rule: #D4DDE2;
  --seal: #B03A2A;
  --seal-soft: rgba(176,58,42,.09);
  --me: #33597F;
  --partner: #4F7355;
  --third: #8C6B25;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  font-size: 15px;
  padding: 22px 14px 56px;
  -webkit-font-smoothing: antialiased;
}
.kb .wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.kb .brand { display: flex; align-items: baseline; gap: 10px; padding: 0 2px; }
.kb .brand h1 { font-family: 'Noto Serif TC', serif; font-size: 20px; font-weight: 700; letter-spacing: .14em; }
.kb .brand span { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--soft); letter-spacing: .12em; }
.kb .warn { font-size: 12px; color: var(--seal); padding: 0 2px; }

.kb .card { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; }

/* ── 連線設定 ── */
.kb .setup .stitle { font-family: 'Noto Serif TC', serif; font-size: 16px; font-weight: 700; letter-spacing: .1em; margin-bottom: 8px; }
.kb .setup p { font-size: 13px; color: var(--soft); line-height: 1.8; }
.kb .setup label { display: block; font-size: 12px; color: var(--soft); letter-spacing: .1em; margin: 14px 0 5px; }
.kb .setup input { width: 100%; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 11px; font-size: 13px; font-family: 'IBM Plex Mono', monospace; background: var(--card); color: var(--ink); }
.kb .setup .row { display: flex; gap: 8px; margin-top: 16px; }
.kb .setup .row .go { flex: 2; letter-spacing: .15em; text-indent: .15em; }
.kb .ghost { flex: 1; padding: 11px 0; border: 1.5px solid var(--rule); background: var(--card); color: var(--soft); border-radius: 8px; font-size: 14px; cursor: pointer; }
.kb .cfgerr { color: var(--seal); font-size: 12.5px; line-height: 1.6; margin-top: 10px; display: none; }

/* ── 月結算 ── */
.kb .summary { position: relative; }
.kb .seal {
  position: absolute; top: 14px; right: 14px;
  width: 54px; height: 54px; padding: 3px;
  background: var(--seal); color: #FBF5EE;
  border-radius: 6px; transform: rotate(-4deg);
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 0 0 1.5px rgba(251,245,238,.4);
  font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 15px;
  writing-mode: vertical-rl; letter-spacing: 3px; line-height: 1;
}
.kb .mnav { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; padding-right: 70px; }
.kb .mnav h2 { font-family: 'Noto Serif TC', serif; font-size: 17px; font-weight: 600; letter-spacing: .05em; padding: 0 4px; }
.kb .navbtn { border: none; background: none; color: var(--soft); cursor: pointer; padding: 3px 8px; border-radius: 6px; font-size: 17px; line-height: 1.2; }
.kb .navbtn:hover { color: var(--ink); background: var(--paper); }
.kb .back { border: none; background: none; color: var(--seal); font-size: 12px; cursor: pointer; padding: 3px 6px; border-radius: 6px; }
.kb .total { margin: 4px 0 14px; }
.kb .total .lbl { display: block; font-size: 11.5px; color: var(--soft); letter-spacing: .22em; margin-bottom: 3px; }
.kb .total .num { font-family: 'IBM Plex Mono', monospace; font-size: 31px; font-weight: 600; color: var(--seal); }
.kb .total .cur { font-size: 15px; font-weight: 500; margin-right: 6px; }

.kb .crow { padding: 9px 0 10px; border-top: 1px dashed var(--rule); }
.kb .chead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.kb .cname { flex: 1; min-width: 0; font-family: 'Noto Serif TC', serif; font-size: 13.5px; font-weight: 600; }
.kb .track { height: 8px; background: var(--paper); border-radius: 4px; overflow: hidden; }
.kb .fill { height: 100%; background: var(--ink); opacity: .82; border-radius: 4px; }
.kb .cval { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
.kb .cpct { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--soft); width: 42px; text-align: right; }

.kb .psec { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--rule); }
.kb .plabel { font-size: 11.5px; color: var(--soft); letter-spacing: .22em; margin-bottom: 9px; }
.kb .pleg { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
.kb .pleg .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.kb .pleg b { font-family: 'IBM Plex Mono', monospace; font-weight: 500; margin-left: 6px; }

/* ── 記帳表單 ── */
.kb .amt { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--ink); padding: 2px 2px 6px; transition: border-color .15s; }
.kb .amt:focus-within { border-color: var(--seal); }
.kb .amt span { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--soft); }
.kb .amt input { flex: 1; width: 100%; border: none; background: none; outline: none; font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 600; color: var(--ink); }
.kb .amt input::-webkit-outer-spin-button, .kb .amt input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.kb .amt input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.kb .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 10px; }
.kb .chip { flex: 1 1 auto; padding: 9px 14px; white-space: nowrap; border: 1.5px solid var(--rule); background: var(--card); border-radius: 8px; font-family: 'Noto Serif TC', serif; font-weight: 600; font-size: 14px; color: var(--soft); cursor: pointer; transition: all .15s; }
.kb .chip.on { border-color: var(--seal); color: var(--seal); background: var(--seal-soft); }
.kb .pt { display: flex; gap: 8px; margin-bottom: 10px; }
.kb .pt button { flex: 1; padding: 9px 0; border-radius: 8px; border: 1.5px solid var(--rule); background: var(--card); color: var(--soft); font-size: 14px; cursor: pointer; transition: all .15s; }
.kb .pt button.on[data-payer="me"] { border-color: var(--me); color: var(--me); background: rgba(51,89,127,.08); font-weight: 700; }
.kb .pt button.on[data-payer="partner"] { border-color: var(--partner); color: var(--partner); background: rgba(79,115,85,.08); font-weight: 700; }
.kb .pt button.on[data-payer="third"] { border-color: var(--third); color: var(--third); background: rgba(140,107,37,.08); font-weight: 700; }
.kb .nd { display: flex; gap: 8px; margin-bottom: 12px; }
.kb .nd input { border: 1px solid var(--rule); border-radius: 8px; padding: 9px 10px; font-size: 14px; background: var(--card); color: var(--ink); font-family: inherit; }
.kb .nd .note { flex: 1; min-width: 0; }
.kb .nd .date { width: 142px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; }
.kb .go { width: 100%; padding: 12px 0; border: none; border-radius: 8px; background: var(--seal); color: #FBF5EE; font-family: 'Noto Serif TC', serif; font-size: 15px; font-weight: 700; letter-spacing: .3em; text-indent: .3em; cursor: pointer; transition: opacity .15s; }
.kb .go:disabled { background: var(--rule); color: #98A5AE; cursor: default; }

/* ── 帳目清單:左側朱紅邊線,如帳簿紙 ── */
.kb .ledger { position: relative; padding: 4px 16px 8px; }
.kb .ledger::before { content: ""; position: absolute; top: 10px; bottom: 10px; left: 52px; width: 1px; background: rgba(176,58,42,.32); }
.kb .dhead { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0 4px 50px; font-size: 12px; color: var(--soft); }
.kb .dhead b { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 12px; color: var(--ink); }
.kb .erow { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 9px 0 9px 50px; border-bottom: 1px solid var(--rule); }
.kb .erow:last-child { border-bottom: none; }
.kb .etxt { min-width: 0; }
.kb .enote { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kb .emeta { font-size: 11.5px; margin-top: 1px; color: var(--soft); }
.kb .emeta.only { font-size: 13px; margin-top: 0; }
.kb .epayer.me { color: var(--me); }
.kb .epayer.partner { color: var(--partner); }
.kb .epayer.third { color: var(--third); }
.kb .eval { font-family: 'IBM Plex Mono', monospace; font-size: 14px; }
.kb .del { border: none; background: none; color: #B9C3CB; cursor: pointer; padding: 2px 7px; border-radius: 6px; font-size: 17px; line-height: 1; transition: all .15s; }
.kb .del:hover { color: var(--seal); }
.kb .del.arm { background: var(--seal); color: #fff; font-size: 12px; padding: 5px 9px; font-family: inherit; }
.kb .del:disabled { opacity: .6; cursor: default; }
.kb .empty { padding: 26px 8px 20px 50px; color: var(--soft); font-size: 14px; line-height: 1.7; }
.kb .retry { margin-top: 10px; border: 1.5px solid var(--seal); background: var(--card); color: var(--seal); border-radius: 8px; padding: 6px 16px; font-size: 13px; cursor: pointer; }
.kb .foot { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 11.5px; color: var(--soft); letter-spacing: .03em; }
.kb .foot button { border: none; background: none; color: var(--me); font-size: 11.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; padding: 2px; }

.kb button:focus-visible, .kb input:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .kb * { transition: none !important; } }
</style>
</head>
<body>
<div class="kb">
  <div class="wrap">

    <header class="brand">
      <h1>兩人家計簿</h1>
      <span>HOUSEHOLD LEDGER</span>
    </header>
    <div class="warn" id="warn" style="display:none">此瀏覽器封鎖了本機儲存(可能是無痕模式),連線設定無法記住,下次要重新輸入。</div>

    <!-- 連線設定 -->
    <section class="setup card" id="setup" style="display:none">
      <div class="stitle">連線設定</div>
      <p>每筆帳會即時寫入妳的 Google 試算表,並同步一份 CSV 在雲端硬碟。請先照說明部署好 Apps Script,再把網址和通行碼貼進來(只需設定一次,會記在這台裝置)。</p>
      <label for="cfg_url">APPS SCRIPT 網址(結尾 /exec)</label>
      <input id="cfg_url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
      <label for="cfg_token">通行碼(和 Code.gs 裡的 TOKEN 一致)</label>
      <input id="cfg_token" type="password" placeholder="通行碼" autocomplete="off">
      <div class="cfgerr" id="cfg_err"></div>
      <div class="row">
        <button class="go" id="cfg_save">連線並開始記帳</button>
        <button class="ghost" id="cfg_cancel" style="display:none">取消</button>
      </div>
    </section>

    <div id="app" style="display:none">
      <div class="wrap" style="padding:0">

        <!-- 月結算 -->
        <section class="summary card">
          <div class="seal" id="seal" aria-hidden="true"></div>
          <div class="mnav">
            <button class="navbtn" id="prev" aria-label="上一個月">‹</button>
            <h2 id="mtitle"></h2>
            <button class="navbtn" id="next" aria-label="下一個月">›</button>
            <button class="back" id="back" style="display:none">回本月</button>
          </div>
          <div class="total">
            <span class="lbl">本月總支出</span>
            <span class="num" id="total"></span>
          </div>
          <div id="crows"></div>
          <div class="psec">
            <div class="plabel">誰付的</div>
            <div class="pleg">
              <span><span class="dot" style="background:var(--me)"></span>我<b id="legme"></b></span>
              <span><span class="dot" style="background:var(--partner)"></span>寶貝<b id="legpa"></b></span>
              <span><span class="dot" style="background:var(--third)"></span>第三人<b id="legth"></b></span>
            </div>
          </div>
        </section>

        <!-- 記一筆 -->
        <section class="card">
          <div class="amt">
            <span>NT$</span>
            <input id="amt" type="number" min="0" step="any" inputmode="decimal" placeholder="0" aria-label="金額">
          </div>
          <div class="chips" id="chips" role="group" aria-label="分類">
            <button class="chip" data-cat="食">食</button>
            <button class="chip" data-cat="行">行</button>
            <button class="chip" data-cat="必要-經常性">必要-經常性</button>
            <button class="chip" data-cat="必要-非經常性">必要-非經常性</button>
            <button class="chip" data-cat="想要">想要</button>
          </div>
          <div class="pt" id="payers" role="group" aria-label="誰付的">
            <button data-payer="me" class="on">我付的</button>
            <button data-payer="partner">寶貝付的</button>
            <button data-payer="third">第三人付的</button>
          </div>
          <div class="nd">
            <input class="note" id="note" type="text" maxlength="40" placeholder="備註,例如:午餐、加油…">
            <input class="date" id="date" type="date" aria-label="日期">
          </div>
          <button class="go" id="go" disabled>記一筆</button>
        </section>

        <!-- 帳目 -->
        <section class="ledger card" id="ledger"></section>

        <div class="foot">
          <span>每筆帳即時寫入 Google 試算表與 CSV</span>·
          <button id="cfg_open">連線設定</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };

  var PAYER_LABEL = { me: "我", partner: "寶貝", third: "第三人" };
  var WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  var CN_MONTH = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二"];
  var CFG_KEY = "ledger-config";

  function pad(n) { return String(n).padStart(2, "0"); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function fmtNum(n) { return n.toLocaleString("zh-TW", { maximumFractionDigits: 2 }); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function sortItems(a) {
    return a.slice().sort(function (x, y) {
      if (x.date < y.date) return 1;
      if (x.date > y.date) return -1;
      return (y.created || 0) - (x.created || 0);
    });
  }

  // ── 連線設定(存在本機,不會出現在 GitHub 上)──
  var storageOK = true;
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); }
  catch (e) { storageOK = false; }

  function loadCfg() {
    if (!storageOK) return null;
    try { return JSON.parse(localStorage.getItem(CFG_KEY) || "null"); }
    catch (e) { return null; }
  }
  var cfg = loadCfg();
  function saveCfg(c) {
    cfg = c;
    if (storageOK) localStorage.setItem(CFG_KEY, JSON.stringify(c));
  }

  // ── API(Apps Script)──
  // POST 不設 Content-Type(維持 text/plain 的 simple request,避免 CORS 預檢)
  function friendly(err) {
    var m = String(err && err.message || err);
    if (m.indexOf("unauthorized") >= 0) return "通行碼不正確,或 Apps Script 還沒部署最新版本。";
    if (m.indexOf("Failed to fetch") >= 0 || m.indexOf("NetworkError") >= 0) return "連不到 Apps Script。常見原因:部署時「誰可以存取」沒選「所有人」,或網址貼錯。";
    if (m.indexOf("Unexpected token") >= 0 || m.indexOf("JSON") >= 0) return "Apps Script 有回應但不是資料。通常是部署時「誰可以存取」沒選「所有人」,或貼到的不是結尾 /exec 的部署網址。";
    return m;
  }
  function handle(r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json().then(function (d) {
      if (!d.ok) throw new Error(d.error || "伺服器回傳錯誤");
      return d;
    });
  }
  function apiGet(c, params) {
    params.token = c.token;
    var q = Object.keys(params).map(function (k) {
      return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]);
    }).join("&");
    return fetch(c.url + "?" + q).then(handle);
  }
  function apiPost(payload) {
    payload.token = cfg.token;
    return fetch(cfg.url, { method: "POST", body: JSON.stringify(payload) }).then(handle);
  }

  // ── 狀態 ──
  var now = new Date();
  var S = {
    viewY: now.getFullYear(),
    viewM: now.getMonth(),
    items: [],
    cat: null,
    payer: "me",
    pendingDel: null,
    delTimer: null,
    busy: false,
    reqSeq: 0
  };

  // ── 畫面 ──
  function renderSummary() {
    var total = S.items.reduce(function (s, i) { return s + i.amount; }, 0);
    var catMap = {};
    S.items.forEach(function (i) { catMap[i.cat] = (catMap[i.cat] || 0) + i.amount; });
    var byCat = Object.keys(catMap).map(function (c) { return { c: c, v: catMap[c] }; })
      .sort(function (a, b) { return b.v - a.v; });
    var maxCat = byCat.length ? byCat[0].v : 0;
    var bp = { me: 0, partner: 0, third: 0 };
    S.items.forEach(function (i) { bp[i.payer] = (bp[i.payer] || 0) + i.amount; });
    var isThis = S.viewY === now.getFullYear() && S.viewM === now.getMonth();

    $("#seal").textContent = CN_MONTH[S.viewM] + "月";
    $("#mtitle").textContent = S.viewY + "年" + (S.viewM + 1) + "月";
    $("#back").style.display = isThis ? "none" : "";
    $("#total").innerHTML = '<span class="cur">NT$</span>' + fmtNum(total);

    $("#crows").innerHTML = byCat.map(function (x) {
      return '<div class="crow">' +
        '<div class="chead">' +
          '<span class="cname">' + esc(x.c) + '</span>' +
          '<span class="cval">' + fmtNum(x.v) + '</span>' +
          '<span class="cpct">' + (total ? Math.round(x.v / total * 100) : 0) + '%</span>' +
        '</div>' +
        '<div class="track"><div class="fill" style="width:' + (maxCat ? x.v / maxCat * 100 : 0) + '%"></div></div>' +
        '</div>';
    }).join("");

    $("#legme").textContent = "NT$ " + fmtNum(bp.me);
    $("#legpa").textContent = "NT$ " + fmtNum(bp.partner);
    $("#legth").textContent = "NT$ " + fmtNum(bp.third);
  }

  function renderLedger() {
    var map = new Map();
    S.items.forEach(function (i) {
      if (!map.has(i.date)) map.set(i.date, []);
      map.get(i.date).push(i);
    });
    var el = $("#ledger");
    if (map.size === 0) {
      el.innerHTML = '<div class="empty">這個月還沒有帳。<br>記下第一筆吧。</div>';
      return;
    }
    var html = "";
    map.forEach(function (list, d) {
      var dt = new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10));
      var sub = list.reduce(function (s, i) { return s + i.amount; }, 0);
      html += '<div class="dhead"><span>' + (+d.slice(5, 7)) + "月" + (+d.slice(8, 10)) + "日 · 週" + WEEK[dt.getDay()] + '</span><b>' + fmtNum(sub) + '</b></div>';
      list.forEach(function (i) {
        html += '<div class="erow">' +
          '<div class="etxt">' +
            (i.note ? '<div class="enote">' + esc(i.note) + '</div>' : "") +
            '<div class="emeta' + (i.note ? "" : " only") + '">' + esc(i.cat) + ' · <span class="epayer ' + i.payer + '">' + (PAYER_LABEL[i.payer] || "") + '付的</span></div>' +
          '</div>' +
          '<span class="eval">' + fmtNum(i.amount) + '</span>' +
          (S.pendingDel === i.id
            ? '<button class="del arm" data-del="' + esc(i.id) + '">刪除</button>'
            : '<button class="del" data-arm="' + esc(i.id) + '" aria-label="刪除這筆">×</button>') +
          '</div>';
      });
    });
    el.innerHTML = html;
  }

  function renderAll() { renderSummary(); renderLedger(); }

  // ── 讀取月份 ──
  function setMonth(y, m, preloaded) {
    S.viewY = y; S.viewM = m;
    S.pendingDel = null;
    if (preloaded) {
      S.items = sortItems(preloaded);
      renderAll();
      return;
    }
    S.items = [];
    renderSummary();
    $("#ledger").innerHTML = '<div class="empty">翻開帳本中…</div>';
    var seq = ++S.reqSeq;
    apiGet(cfg, { month: y + "-" + pad(m + 1) }).then(function (d) {
      if (seq !== S.reqSeq) return;
      S.items = sortItems(d.items || []);
      renderAll();
    }).catch(function (err) {
      if (seq !== S.reqSeq) return;
      $("#ledger").innerHTML =
        '<div class="empty">讀取失敗:' + esc(friendly(err)) +
        '<br><button class="retry" id="retry">重試</button></div>';
      $("#retry").onclick = function () { setMonth(S.viewY, S.viewM); };
    });
  }

  // ── 記一筆 ──
  function updateGo() {
    var amt = parseFloat($("#amt").value);
    $("#go").disabled = S.busy || !(amt > 0 && S.cat);
  }

  function submit() {
    if (S.busy) return;
    var amt = parseFloat($("#amt").value);
    if (!(amt > 0) || !S.cat) return;
    var d = $("#date").value || todayStr();
    var y = +d.slice(0, 4), m = +d.slice(5, 7) - 1;
    var rec = {
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 6),
      date: d,
      amount: amt,
      cat: S.cat,
      payer: S.payer,
      note: $("#note").value.trim().slice(0, 40),
      created: Date.now()
    };
    S.busy = true;
    var go = $("#go");
    go.disabled = true;
    go.textContent = "記錄中…";
    apiPost({ action: "add", record: rec }).then(function () {
      $("#amt").value = ""; $("#note").value = ""; S.cat = null;
      document.querySelectorAll("#chips .chip").forEach(function (b) { b.classList.remove("on"); });
      if (y === S.viewY && m === S.viewM) {
        S.items = sortItems(S.items.concat([rec]));
        renderAll();
      } else {
        setMonth(y, m); // 記到別的月份:跳過去看
      }
    }).catch(function (err) {
      alert("記錄失敗:" + friendly(err));
    }).finally(function () {
      S.busy = false;
      go.textContent = "記一筆";
      updateGo();
    });
  }

  // ── 事件 ──
  $("#prev").onclick = function () {
    var y = S.viewY, m = S.viewM - 1;
    if (m < 0) { m = 11; y--; }
    setMonth(y, m);
  };
  $("#next").onclick = function () {
    var y = S.viewY, m = S.viewM + 1;
    if (m > 11) { m = 0; y++; }
    setMonth(y, m);
  };
  $("#back").onclick = function () { setMonth(now.getFullYear(), now.getMonth()); };

  $("#chips").addEventListener("click", function (e) {
    var b = e.target.closest(".chip");
    if (!b) return;
    S.cat = b.dataset.cat;
    document.querySelectorAll("#chips .chip").forEach(function (x) {
      x.classList.toggle("on", x === b);
    });
    updateGo();
  });

  $("#payers").addEventListener("click", function (e) {
    var b = e.target.closest("[data-payer]");
    if (!b) return;
    S.payer = b.dataset.payer;
    document.querySelectorAll("#payers button").forEach(function (x) {
      x.classList.toggle("on", x === b);
    });
  });

  $("#amt").addEventListener("input", updateGo);
  ["amt", "note"].forEach(function (id) {
    $("#" + id).addEventListener("keydown", function (e) {
      if (e.key === "Enter") submit();
    });
  });
  $("#go").onclick = submit;

  $("#ledger").addEventListener("click", function (e) {
    var arm = e.target.closest("[data-arm]");
    var del = e.target.closest("[data-del]");
    if (arm) {
      clearTimeout(S.delTimer);
      S.pendingDel = arm.dataset.arm;
      S.delTimer = setTimeout(function () { S.pendingDel = null; renderLedger(); }, 2600);
      renderLedger();
    } else if (del) {
      clearTimeout(S.delTimer);
      var id = del.dataset.del;
      del.disabled = true;
      del.textContent = "刪除中…";
      apiPost({ action: "delete", id: id }).then(function () {
        S.items = S.items.filter(function (i) { return i.id !== id; });
        S.pendingDel = null;
        renderAll();
      }).catch(function (err) {
        alert("刪除失敗:" + friendly(err));
        S.pendingDel = null;
        renderLedger();
      });
    }
  });

  // ── 連線設定畫面 ──
  function showSetup() {
    $("#cfg_url").value = cfg && cfg.url || "";
    $("#cfg_token").value = cfg && cfg.token || "";
    $("#cfg_err").style.display = "none";
    $("#cfg_cancel").style.display = cfg ? "" : "none";
    $("#setup").style.display = "";
    $("#app").style.display = "none";
  }
  function showApp() {
    $("#setup").style.display = "none";
    $("#app").style.display = "";
  }
  function cfgError(msg) {
    var el = $("#cfg_err");
    el.textContent = msg;
    el.style.display = "block";
  }

  $("#cfg_open").onclick = showSetup;
  $("#cfg_cancel").onclick = function () { showApp(); };

  function trySave() {
    if (S.busy) return;
    var url = $("#cfg_url").value.trim();
    var token = $("#cfg_token").value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) {
      cfgError("網址格式不對,應該是 https://script.google.com/macros/s/…/exec");
      return;
    }
    if (url.indexOf("/exec") < 0) {
      cfgError("這不是部署網址:請到 Apps Script 的「部署 → 管理部署作業」複製結尾是 /exec 的網頁應用程式網址(不是編輯器的網址)。");
      return;
    }
    if (!token) { cfgError("請輸入通行碼(和 Code.gs 裡的 TOKEN 一致)。"); return; }
    S.busy = true;
    var btn = $("#cfg_save");
    btn.disabled = true;
    btn.textContent = "測試連線中…";
    $("#cfg_err").style.display = "none";
    var testCfg = { url: url, token: token };
    var monthStr = now.getFullYear() + "-" + pad(now.getMonth() + 1);
    apiGet(testCfg, { month: monthStr }).then(function (d) {
      saveCfg(testCfg);
      showApp();
      setMonth(now.getFullYear(), now.getMonth(), d.items || []);
    }).catch(function (err) {
      cfgError("連線失敗:" + friendly(err));
    }).finally(function () {
      S.busy = false;
      btn.disabled = false;
      btn.textContent = "連線並開始記帳";
    });
  }
  $("#cfg_save").onclick = trySave;
  ["cfg_url", "cfg_token"].forEach(function (id) {
    $("#" + id).addEventListener("keydown", function (e) {
      if (e.key === "Enter") trySave();
    });
  });

  // ── 啟動 ──
  $("#date").value = todayStr();
  if (!storageOK) $("#warn").style.display = "";
  if (cfg && cfg.url && cfg.token) {
    showApp();
    setMonth(now.getFullYear(), now.getMonth());
  } else {
    showSetup();
  }
})();
</script>
</body>
</html>
